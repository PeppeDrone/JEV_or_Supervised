name: uci_autism
description: UCI Autism Screening Adult (704 adults). Binary ASD classification.
file: patients.csv
separator: ','
id_column: record_id
pseudonymize: false
setting: Adult (aged 17 or older) completing the ten-item Autism Spectrum Quotient (AQ-10) screening questionnaire
  through a mobile application (Thabtah 2017). The observations are the ten item responses, each recorded as whether
  the answer was in the autistic-trait direction, and the demographic details entered with the questionnaire.
observations_header: 'AQ-10 item responses (autistic-trait direction) and demographics:'
predictors:
  a1_score:
    column: a1_score
    kind: categorical
    text_label: 'AQ-10 item 1: Often notices small sounds when others do not'
    text_values:
      '1': 'Yes'
      '0': 'No'
  a2_score:
    column: a2_score
    kind: categorical
    text_label: 'AQ-10 item 2: Concentrates on small details rather than the whole picture'
    text_values:
      '1': 'Yes'
      '0': 'No'
  a3_score:
    column: a3_score
    kind: categorical
    text_label: 'AQ-10 item 3: Finds it hard to do more than one thing at once'
    text_values:
      '1': 'Yes'
      '0': 'No'
  a4_score:
    column: a4_score
    kind: categorical
    text_label: 'AQ-10 item 4: Finds it hard to return to a task after an interruption'
    text_values:
      '1': 'Yes'
      '0': 'No'
  a5_score:
    column: a5_score
    kind: categorical
    text_label: 'AQ-10 item 5: Finds it hard to read between the lines in conversation'
    text_values:
      '1': 'Yes'
      '0': 'No'
  a6_score:
    column: a6_score
    kind: categorical
    text_label: 'AQ-10 item 6: Finds it hard to tell when a listener is getting bored'
    text_values:
      '1': 'Yes'
      '0': 'No'
  a7_score:
    column: a7_score
    kind: categorical
    text_label: 'AQ-10 item 7: Finds it difficult to work out characters'' intentions when reading a story'
    text_values:
      '1': 'Yes'
      '0': 'No'
  a8_score:
    column: a8_score
    kind: categorical
    text_label: 'AQ-10 item 8: Likes to collect information about categories of things'
    text_values:
      '1': 'Yes'
      '0': 'No'
  a9_score:
    column: a9_score
    kind: categorical
    text_label: 'AQ-10 item 9: Finds it hard to work out what someone thinks or feels from their face'
    text_values:
      '1': 'Yes'
      '0': 'No'
  a10_score:
    column: a10_score
    kind: categorical
    text_label: 'AQ-10 item 10: Finds it difficult to work out people''s intentions'
    text_values:
      '1': 'Yes'
      '0': 'No'
  age:
    column: age
    kind: numeric
    text_label: Age
    unit: years
    text_range:
    - 17
    - 110
  gender:
    column: gender
    kind: categorical
    text_label: Sex
    text_values:
      f: Female
      m: Male
  ethnicity:
