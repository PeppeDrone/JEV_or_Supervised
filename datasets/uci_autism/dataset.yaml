    column: asd
    classes:
    - AQ-10 screen negative
    - AQ-10 screen positive (6 or more items endorsed)
    mapping:
      '0': AQ-10 screen negative
      '1': AQ-10 screen positive (6 or more items endorsed)
    question: Based on these AQ-10 item responses and demographics, does this adult screen positive for autism spectrum
      traits on the AQ-10?
