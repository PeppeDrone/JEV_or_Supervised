outcomes:
  lethal:
    column: lethal
    classes:
    - Survived the hospital stay
    - Died during the hospital stay
    mapping:
      '0': Survived the hospital stay
      '1': Died during the hospital stay
    question: Based on the history, admission findings, admission laboratory values and treatment during the first
      three days, did this patient die during the hospital stay for this myocardial infarction?
