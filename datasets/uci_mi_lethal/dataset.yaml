name: uci_mi_lethal
description: UCI Myocardial infarction complications (Krasnoyarsk, 1992-1995; 1700 patients, 111 predictors). Binary
  in-hospital lethal outcome (LET_IS > 0). Predictors cover history, admission examination, admission ECG, admission
  laboratory values and treatment up to the third hospital day.
file: patients.csv
separator: ','
id_column: record_id
pseudonymize: false
setting: Adult admitted to the intensive cardiac care unit of a city hospital with an acute myocardial infarction.
  The record covers the cardiovascular history, the examination and ECG at admission, admission blood tests, and
  the drugs given by the emergency cardiology team and in the unit during the first three hospital days.
observations_header: 'History, admission findings, admission laboratory values and early treatment:'
predictors:
  age:
    column: age
    kind: numeric
    text_label: Age
    unit: years
  sex:
    column: sex
    kind: categorical
    text_label: Sex
    text_values:
      '0': Female
      '1': Male
  inf_anam:
    column: inf_anam
    kind: categorical
    text_label: Number of previous myocardial infarctions
    text_values:
      '0': None
      '1': One
      '2': Two
      '3': Three or more
  stenok_an:
    column: stenok_an
    kind: categorical
    text_label: Exertional angina in the history (time since onset)
    text_values:
      '0': Never had exertional angina
      '1': Angina began during the last year
      '2': Angina began one year ago
      '3': Angina began two years ago
      '4': Angina began three years ago
      '5': Angina began 4-5 years ago
      '6': Angina began more than 5 years ago
  fk_stenok:
    column: fk_stenok
    kind: categorical
    text_label: Functional class of angina pectoris in the last year
    text_values:
      '0': No angina pectoris
      '1': Functional class I (angina only on strenuous exertion)
      '2': Functional class II (slight limitation of ordinary activity)
      '3': Functional class III (marked limitation of ordinary activity)
      '4': Functional class IV (angina at rest or on any activity)
  ibs_post:
    column: ibs_post
    kind: categorical
    text_label: Coronary heart disease in the weeks and days before admission
    text_values:
      '0': None
      '1': Exertional angina pectoris
      '2': Unstable angina pectoris
  ibs_nasl:
    column: ibs_nasl
    kind: categorical
    text_label: Family history of coronary heart disease
    text_values:
      '0': Not burdened
      '1': Burdened
  gb:
    column: gb
    kind: categorical
    text_label: Essential hypertension
    text_values:
      '0': No essential hypertension
      '1': Stage 1
      '2': Stage 2
      '3': Stage 3
  sim_gipert:
    column: sim_gipert
    kind: categorical
    text_label: Symptomatic (secondary) hypertension
    text_values: &id001
      '0': 'No'
      '1': 'Yes'
  dlit_ag:
    column: dlit_ag
    kind: categorical
    text_label: Duration of arterial hypertension
    text_values:
      '0': No arterial hypertension
      '1': One year
      '2': Two years
      '3': Three years
      '4': Four years
      '5': Five years
      '6': 6-10 years
      '7': More than 10 years
  zsn_a:
    column: zsn_a
    kind: categorical
    text_label: Chronic heart failure in the history
    text_values:
      '0': No chronic heart failure
      '1': Stage I
      '2': Stage II with right-ventricular failure (systemic congestion)
      '3': Stage II with left-ventricular failure (pulmonary congestion)
      '4': Stage II with both right- and left-ventricular failure
  nr_11:
    column: nr_11
    kind: categorical
    text_label: Arrhythmia of any kind in the history
    text_values: *id001
  nr_01:
    column: nr_01
    kind: categorical
    text_label: Premature atrial contractions in the history
    text_values: *id001
  nr_02:
    column: nr_02
    kind: categorical
