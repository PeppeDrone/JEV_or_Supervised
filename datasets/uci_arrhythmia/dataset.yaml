name: uci_arrhythmia
description: 'UCI Cardiac Arrhythmia (Bilkent; 429 observations after excluding rhythm classes with n<10; 23 rows
  dropped). 279 predictors: demographics, global interval/axis measurements and, for each of the 12 standard leads,
  wave widths, deflection counts, morphology flags, wave amplitudes and QRS/QRST areas. 8 retained rhythm classes.'
file: patients.csv
separator: ','
id_column: record_id
pseudonymize: false
setting: Adult referred for a standard resting 12-lead electrocardiogram. The observations are the automatically
  measured global intervals, frontal-plane axes and heart rate, followed by, for each of the twelve leads (DI, DII,
  DIII, aVR, aVL, aVF, V1-V6), the wave widths, number of intrinsic deflections, wave-morphology flags, wave amplitudes
  and QRS/QRST areas.
observations_header: 'Resting 12-lead ECG measurements (widths in ms; amplitudes in tenths of a millivolt; 0 means
  the wave is absent in that lead):'
predictors:
  age:
    column: age
    kind: numeric
    text_label: Age
    unit: years
  sex:
    column: sex
    kind: categorical
    text_label: Sex
    text_values:
      '0': Male
      '1': Female
  height:
    column: height
    kind: numeric
    text_label: Height
    unit: cm
  weight:
    column: weight
    kind: numeric
    text_label: Weight
    unit: kg
  qrs_duration:
    column: qrs_duration
    kind: numeric
    text_label: Average QRS duration
    unit: ms
  pr_interval:
    column: pr_interval
    kind: numeric
    text_label: Average P-R interval (onset of P to onset of Q)
    unit: ms
  qt_interval:
    column: qt_interval
    kind: numeric
    text_label: Average Q-T interval (onset of Q to offset of T)
    unit: ms
  t_interval:
    column: t_interval
    kind: numeric
    text_label: Average T-wave duration
    unit: ms
  p_interval:
    column: p_interval
    kind: numeric
    text_label: Average P-wave duration
    unit: ms
  qrs_angle:
    column: qrs_angle
    kind: numeric
    text_label: QRS axis in the frontal plane
    unit: degrees
  t_angle:
    column: t_angle
    kind: numeric
    text_label: T-wave axis in the frontal plane
    unit: degrees
  p_angle:
    column: p_angle
    kind: numeric
    text_label: P-wave axis in the frontal plane
    unit: degrees
  qrst_angle:
    column: qrst_angle
    kind: numeric
    text_label: QRST axis in the frontal plane
    unit: degrees
  j_angle:
    column: j_angle
    kind: numeric
    text_label: J-point axis in the frontal plane
    unit: degrees
  heart_rate:
    column: heart_rate
    kind: numeric
    text_label: Heart rate
    unit: beats/min
