name: physionet_2012
description: PhysioNet/CinC Challenge 2012 ICU set A (first 1000 patients). Binary in-hospital death from 48-hour
  named vitals and laboratories.
file: patients.csv
separator: ','
id_column: record_id
pseudonymize: false
setting: Adult admitted to an intensive care unit (PhysioNet/CinC Challenge 2012, set A) and staying at least 48
  hours. The observations are demographics, ICU type, and for each recorded vital sign and laboratory test the last
  value and the mean over the first 48 hours of the stay; tests that were never ordered are marked as not observed.
observations_header: 'First 48 hours in the ICU (last value and 48-hour mean per variable):'
predictors:
  age:
    column: age
    kind: numeric
    text_label: Age
    unit: years
  sex:
    column: sex
    kind: categorical
    text_label: Sex
    text_values:
      Female: Female
      Male: Male
  height:
    column: height
    kind: numeric
    text_label: Height
    unit: cm
  weight:
    column: weight
    kind: numeric
    text_label: Weight
    unit: kg
  icu_type:
    column: icu_type
    kind: categorical
    text_label: ICU type
    text_values:
      Surgical ICU: Surgical ICU
      Cardiac surgery recovery: Cardiac surgery recovery
      Medical ICU: Medical ICU
      Coronary care unit: Coronary care unit
  mech_vent:
    column: mech_vent
    kind: categorical
    text_label: Mechanical ventilation recorded during the first 48 hours
    text_values:
      'Yes': 'Yes'
  alp_last:
    column: alp_last
    kind: numeric
    text_label: Alkaline phosphatase (last 48h)
    unit: IU/L
  alp_mean:
    column: alp_mean
    kind: numeric
    text_label: Alkaline phosphatase (mean 48h)
    unit: IU/L
  alt_last:
