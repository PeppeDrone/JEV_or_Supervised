outcomes:
  icu_death:
    column: icu_death
    classes:
    - Survived to hospital discharge
    - Died in hospital
    mapping:
      '0': Survived to hospital discharge
      '1': Died in hospital
    question: Based on the first 48 hours of ICU vital signs and laboratory results, did this patient die before
      hospital discharge?
