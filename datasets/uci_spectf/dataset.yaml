name: uci_spectf
description: UCI SPECTF Heart (267 patients, 44 features). Perfusion counts in 22 myocardial regions of interest
  at rest and under stress, summarising cardiac SPECT images; binary normal vs abnormal study as judged by cardiologists.
file: patients.csv
separator: ','
id_column: record_id
pseudonymize: false
setting: Adult undergoing myocardial perfusion imaging with cardiac single-photon emission computed tomography (SPECT),
  acquired at rest and after stress. The observations are the integer perfusion counts (0-100 scale, higher means
  better tracer uptake) in each of 22 regions of interest of the left ventricle, listed as rest and stress pairs.
observations_header: 'Myocardial perfusion counts per region of interest (ROI), rest and stress (0-100 scale):'
predictors:
