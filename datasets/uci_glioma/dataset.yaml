      '0': Wild type
      '1': Mutated
outcomes:
  gbm:
    column: gbm
    classes:
    - Lower-grade glioma (WHO grade II or III)
    - Glioblastoma (WHO grade IV)
    mapping:
      '0': Lower-grade glioma (WHO grade II or III)
      '1': Glioblastoma (WHO grade IV)
    question: Based on these demographics and the tumour's somatic mutation status, is this glioma a glioblastoma?
